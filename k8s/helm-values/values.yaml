serviceAccount:
  name: retail-app-sa
  create: false

catalog:
  persistence:
    provider: "external"
  serviceAccount:
    create: false
  extraEnv:
    - name: RETAIL_CATALOG_PERSISTENCE_PROVIDER
      value: "mysql"
    - name: RETAIL_CATALOG_PERSISTENCE_ENDPOINT
      value: "<catalog-mysql-rds-endpoint>:3306"
    - name: RETAIL_CATALOG_PERSISTENCE_DB_NAME
      value: "catalog"

orders:
  serviceAccount:
    create: false
  extraEnv:
    - name: RETAIL_ORDERS_PERSISTENCE_PROVIDER
      value: "postgres"
    - name: RETAIL_ORDERS_PERSISTENCE_ENDPOINT
      value: "<orders-postgres-rds-endpoint>:5432"
    - name: AWS_REGION
      value: "us-east-1"

carts:
  serviceAccount:
    create: false
  extraEnv:
    - name: RETAIL_CART_PERSISTENCE_PROVIDER
      value: "dynamodb"
    - name: RETAIL_CART_PERSISTENCE_DYNAMODB_TABLE_NAME
      value: "bedrock-carts"

rabbitmq:
  enabled: true

redis:
  enabled: true

mysql:
  enabled: false

postgresql:
  enabled: false

dynamodb:
  enabled: false